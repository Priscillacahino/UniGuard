name: Atualizar apresentacao integrada

on:
  push:
    branches: [main]
    paths:
      - "tools/update_integrated_presentation.py"
      - ".github/workflows/update-integrated-presentation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-presentation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install python-pptx
          sudo apt-get update
          sudo apt-get install -y libreoffice

      - name: Atualizar PowerPoint
        run: python tools/update_integrated_presentation.py

      - name: Gerar PDF a partir do PowerPoint
        run: |
          mkdir -p build-pdf
          libreoffice --headless --convert-to pdf --outdir build-pdf UniGuard_Apresentacao_Profissional_Atualizada.pptx
          cp build-pdf/UniGuard_Apresentacao_Profissional_Atualizada.pdf UniGuard_Apresentacao_Profissional.pdf

      - name: Publicar documentos integrados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add UniGuard_Apresentacao_Profissional_Atualizada.pptx UniGuard_Apresentacao_Profissional.pdf
          git commit -m "docs: unificar apresentacao profissional do UniGuard" || exit 0
          git push
