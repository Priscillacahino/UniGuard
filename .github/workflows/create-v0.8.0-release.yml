name: Criar release v0.8.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/create-v0.8.0-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Criar tag e release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.8.0 >/dev/null 2>&1; then
            echo "Release v0.8.0 já existe."
            exit 0
          fi

          gh release create v0.8.0 \
            --target main \
            --title "v0.8.0 — Academic Prototype" \
            --notes-file - <<'EOF'
          # UniGuard v0.8.0 — Academic Prototype

          Primeiro marco oficial de release do UniGuard.

          Esta versão registra o estado atual do projeto como **protótipo acadêmico avançado / MVP demonstrativo em desenvolvimento**. Não representa um serviço oficial de emergência, implantação institucional ou produto pronto para operação real.

          ## Principais entregas

          - aplicativo Android em Kotlin e protótipo web em React/TypeScript;
          - integração progressiva com Firebase Authentication, Firestore e Storage;
          - autenticação por e-mail/senha com verificação de e-mail;
          - autorização institucional por `memberships/{uid}` e operadores por `operators/{uid}`;
          - isolamento de dados por `institutionId`;
          - auditoria append-only para eventos relevantes;
          - políticas documentadas de retenção e eliminação;
          - proteção de evidências contra sobrescrita pelo cliente;
          - bloqueio de dados médicos desnecessários e do campo legado `medicalNotes`;
          - controles locais contra abuso e repetição de alertas;
          - modelo relacional MySQL para estudo e evolução futura;
          - dados demonstrativos para análise;
          - apresentação profissional em PDF e PowerPoint;
          - requisitos funcionais, não funcionais e regras de negócio documentados;
          - `SECURITY.md`, `CHANGELOG.md`, documentação de arquitetura e matriz de riscos;
          - templates de Issues e Pull Requests, `CODEOWNERS` e Dependabot.

          ## Segurança e governança

          Esta versão consolida controles e documentação relacionados a autenticação, autorização, isolamento institucional, auditoria, retenção, evidências, abuso de alertas e privacidade.

          ## Antes de qualquer piloto institucional

          Ainda precisam ser concluídos, entre outros pontos:

          - validação ponta a ponta Android → Firebase → Central;
          - testes negativos de isolamento entre instituições;
          - ativação e comprovação dos TTLs no Firestore;
          - configuração do ciclo de vida do Firebase Storage;
          - Firebase App Check;
          - rate limiting em backend confiável;
          - testes de segurança, privacidade, acessibilidade e desempenho;
          - formalização jurídica, operacional e institucional.

          ## Responsabilidade geral

          **Priscilla Cahino — Responsável geral pelo projeto UniGuard.**

          Atuação abrangendo idealização, concepção do produto, proposta de valor, fluxos, requisitos, regras de negócio, prototipação, documentação, organização dos artefatos e consolidação do projeto acadêmico.

          ---

          **Uso demonstrativo e acadêmico. Não utilizar dados pessoais reais em testes públicos.**
          EOF
