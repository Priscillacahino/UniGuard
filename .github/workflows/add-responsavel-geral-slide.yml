name: Adicionar responsavel geral na apresentacao

on:
  push:
    branches: [main]
    paths:
      - "tools/add_responsavel_geral_slide.py"
      - ".github/workflows/add-responsavel-geral-slide.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-presentation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install python-pptx
          sudo apt-get update
          sudo apt-get install -y libreoffice

      - name: Adicionar slide final
        run: python tools/add_responsavel_geral_slide.py

      - name: Gerar PDF atualizado
        run: |
          mkdir -p build-pdf
          libreoffice --headless --convert-to pdf --outdir build-pdf UniGuard_Apresentacao_Profissional_Atualizada.pptx
          cp build-pdf/UniGuard_Apresentacao_Profissional_Atualizada.pdf UniGuard_Apresentacao_Profissional.pdf

      - name: Publicar arquivos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add UniGuard_Apresentacao_Profissional_Atualizada.pptx UniGuard_Apresentacao_Profissional.pdf
          git commit -m "docs: adicionar autoria e responsabilidade geral na apresentacao" || exit 0
          git push
