name: Validar UniGuard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: uniguard-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web — testes, segurança e build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verificar arquivos sensíveis versionados
        shell: bash
        run: |
          forbidden="$(git ls-files | grep -Ei '(^|/)\.env$|(^|/)google-services\.json$|service[-_]?account.*\.json$|firebase-adminsdk.*\.json$|\.(pem|p12|pfx|jks|keystore)$' || true)"
          if [ -n "$forbidden" ]; then
            echo "Arquivos sensíveis não permitidos no repositório:"
            echo "$forbidden"
            exit 1
          fi

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes automatizados
        run: npm test

      - name: Verificar TypeScript
        run: npm run lint

      - name: Auditar dependências críticas
        run: npm audit --audit-level=critical

      - name: Gerar aplicação web
        run: npm run build

      - name: Publicar artefato do build web
        uses: actions/upload-artifact@v7
        with:
          name: uniguard-web-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android — testes, lint e APK demonstrativo
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Autorizar Gradle Wrapper
        run: chmod +x gradlew

      - name: Executar testes unitários Android
        run: ./gradlew testDebugUnitTest

      - name: Executar Android Lint
        run: ./gradlew lintDebug

      - name: Gerar APK demonstrativo
        run: ./gradlew assembleDebug

      - name: Validar build release
        run: ./gradlew assembleRelease

      - name: Publicar APK demonstrativo
        uses: actions/upload-artifact@v7
        with:
          name: uniguard-android-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publicar APK release não assinado
        uses: actions/upload-artifact@v7
        with:
          name: uniguard-android-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publicar relatório de lint Android
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: uniguard-android-lint
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 7

  firebase-rules:
    name: Firebase — regras no Emulator
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências do projeto
        run: npm ci

      - name: Instalar ferramentas de teste Firebase
        run: npm install --no-save --package-lock=false @firebase/rules-unit-testing@5.0.2 firebase-tools@15.30.1

      - name: Validar regras Firestore e Storage no Emulator
        run: >
          npx firebase-tools@15.30.1 emulators:exec
          --project uniguard-ci-demo
          --only firestore,storage
          "node tests/firestoreRules.emulator.mjs && node tests/storageRules.emulator.mjs"

  backend:
    name: Backend — rate limit e validação
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências do backend
        working-directory: functions
        run: npm install --ignore-scripts

      - name: Testar rate limiting confiável
        working-directory: functions
        run: npm test

      - name: Validar sintaxe das funções
        working-directory: functions
        run: node --check index.js && node --check auditLegacyData.js

      - name: Auditar dependências críticas do backend
        working-directory: functions
        run: npm audit --audit-level=critical
