name: Atualizar PDF profissional

# Gera o PDF profissional a partir da fonte versionada no repositório.
on:
  push:
    branches: [main]
    paths:
      - "tools/build_professional_pdf.py"
      - ".github/workflows/update-professional-pdf.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar apresentação profissional
        run: python tools/build_professional_pdf.py

      - name: Publicar PDF atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add UniGuard_Apresentacao_Profissional.pdf
          if git diff --cached --quiet; then
            echo "PDF já está atualizado."
            exit 0
          fi
          git commit -m "docs: atualizar apresentação profissional do UniGuard"
          git push
